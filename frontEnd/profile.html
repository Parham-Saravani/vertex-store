<!doctype html>
<html lang="fa" dir="rtl" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./src/assets/images/logo/favicon.png" />
    <title>حساب کاربری</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="dark:bg-dark-bg-primary h-dvh font-vazir bg-light-bg-primary">
    <!-- Loader Element -->
    <div class="fixed flex justify-center items-center w-full h-full dark:bg-dark-bg-primary bg-light-bg-primary z-50 top-0 right-0 page-loader">
        <div
            class="dark:bg-dark-card-bg bg-light-card-bg border dark:border-transparent border-light-card-border w-50 py-10 flex gap-5 flex-col justify-center items-center rounded-xl">
            <p class="text-[16px] dark:text-dark-text-primary text-light-text-primary font-vazir">در حال بارگذاری</p>
            <div class="loader w-4 rounded-full animate-loader aspect-square"></div>
        </div>
    </div>

    <!-- modal -->
    <div class="fixed hidden justify-center items-center inset-0 backdrop-blur-xl z-2000 modal">
        <div
            class="px-5 py-5 w-90 dark:bg-dark-bg-primary bg-light-bg-primary border dark:border-dark-card-border border-light-card-border rounded-xl">
            <h3 class="text-[14px] text-center dark:text-dark-text-primary text-light-text-primary">آیا مطمئن هستید که
                می‌خواهید از حساب کاربری خود خارج شوید؟</h3>
            <div class="flex justify-center gap-2 items-center mt-9">
                <button
                    class="w-30 h-11 border border-transparent dark:hover:border-dark-card-border hover:border-light-card-border transition-colors duration-300 rounded-xl cursor-pointer dark:text-dark-text-primary text-light-text-primary close-modal">انصراف</button>
                <button
                    class="w-30 h-11 rounded-xl hover:dark:bg-red-700/20 dark:hover:text-red-600 hover:bg-red-600 dark:text-red-600 text-red-600 border border-red-600 hover:text-dark-text-primary transition-colors duration-300 cursor-pointer modal-confirm">خروج</button>
            </div>
        </div>
    </div>

    <!-- mobile header -->
    <div class="hidden max-lg:block max-lg:fixed max-lg:left-0 max-lg:top-0 max-lg:right-0 dark:bg-dark-section-bg bg-light-section-bg z-10 w-full">
        <div class="flex items-center justify-between border-b dark:border-dark-divider border-light-divider px-3 py-3 ">
            <button class="hidden max-lg:flex z-40 w-10 h-10  rounded-xl justify-center items-center cursor-pointer profile-mobile-menu-btn">
                <svg class="dark:text-svg-dark text-svg-light" width="24" height="24" viewBox="0 0 24 24" fill="currentcolor" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M3.25 6C3.25 5.58579 3.58579 5.25 4 5.25L20 5.25C20.4142 5.25 20.75 5.58579 20.75 6C20.75 6.41421 20.4142 6.75 20 6.75L4 6.75C3.58579 6.75 3.25 6.41422 3.25 6ZM3.25 18C3.25 17.5858 3.58579 17.25 4 17.25L20 17.25C20.4142 17.25 20.75 17.5858 20.75 18C20.75 18.4142 20.4142 18.75 20 18.75L4 18.75C3.58579 18.75 3.25 18.4142 3.25 18ZM4 11.25C3.58579 11.25 3.25 11.5858 3.25 12C3.25 12.4142 3.58579 12.75 4 12.75L12 12.75C12.4142 12.75 12.75 12.4142 12.75 12C12.75 11.5858 12.4142 11.25 12 11.25L4 11.25Z" fill=""></path>
                </svg>
            </button>
            <h1 class="z-40 bg-linear-90 from-brand-primary to-brand-accent text-transparent bg-clip-text font-bold text-4xl">
                Vertex
            </h1>
            <button class="hidden max-lg:flex z-40 w-10 h-10 rounded-xl justify-center items-center cursor-pointer profile-user-data-btn">
                <svg class="dark:text-svg-dark text-svg-light" width="24" height="24" viewBox="0 0 24 24" fill="currentcolor" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M5.99902 10.4951C6.82745 10.4951 7.49902 11.1667 7.49902 11.9951V12.0051C7.49902 12.8335 6.82745 13.5051 5.99902 13.5051C5.1706 13.5051 4.49902 12.8335 4.49902 12.0051V11.9951C4.49902 11.1667 5.1706 10.4951 5.99902 10.4951ZM17.999 10.4951C18.8275 10.4951 19.499 11.1667 19.499 11.9951V12.0051C19.499 12.8335 18.8275 13.5051 17.999 13.5051C17.1706 13.5051 16.499 12.8335 16.499 12.0051V11.9951C16.499 11.1667 17.1706 10.4951 17.999 10.4951ZM13.499 11.9951C13.499 11.1667 12.8275 10.4951 11.999 10.4951C11.1706 10.4951 10.499 11.1667 10.499 11.9951V12.0051C10.499 12.8335 11.1706 13.5051 11.999 13.5051C12.8275 13.5051 13.499 12.8335 13.499 12.0051V11.9951Z" fill=""></path>
                </svg>
            </button>
        </div>

        <div class="w-full transition-height duration-300 h-0 overflow-hidden dark:bg-dark-section-bg bg-light-section-bg profile-mobile-user-data">
            <div class="w-full items-center justify-between gap-4 px-5 py-4 lg:flex lg:justify-end lg:px-0 lg:shadow-none flex">
                <!-- User Area -->
                <div class="[direction:ltr] relative">
                    <div class="flex items-center text-gray-700 dark:text-gray-400">
                        <img class="hidden size-10 bg-center bg-cover rounded-full profile-image" alt="User">
                        <div class="size-9 bg-linear-90 from-brand-accent to-brand-primary rounded-full flex items-center justify-center font-bold text-dark-text-primary profile-avatar">A</div>

                        <span class="ml-2 mr-1 text-sm block font-medium profile-username">Musharof</span>
                        <i class="fa-solid fa-chevron-down text-sm inline-flex"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    
    <div class="flex mx-auto min-h-screen">
        <!-- menu -->
        <div class="py-4 max-lg:z-101 max-lg:top-0 max-lg:-right-70 fixed right-0 top-0 w-64 h-screen dark:bg-dark-section-bg bg-light-section-bg border-l dark:border-dark-card-border border-light-card-border z-40 transition-right duration-300 profile-mobile-menu">
            <header>
                <a href="https://vertex-store-chi.vercel.app" class="max-lg:hidden flex justify-center items-center">
                    <h1 class="bg-linear-90 from-brand-primary to-brand-accent text-transparent bg-clip-text font-bold text-4xl">
                        Vertex
                    </h1>
                </a>
            </header>
            <main class="flex flex-col gap-2 h-140 overflow-y-scroll hide-scrollbar px-2 py-3 mt-10 menu-content"> 
            </main>

            <footer class="absolute w-full bottom-2 px-2">
                <a href="http://localhost:5173"
                    class="block w-full text-right dark:text-dark-text-primary text-light-text-primary py-3 px-3 cursor-pointer transition-colors duration-300 hover:text-dark-text-primary hover:bg-brand-accent font-bold rounded-xl">
                    <i class="fa-solid fa-home"></i>
                    صفحه اصلی
                </a>
                <button
                    class="w-full text-right text-red-600 py-3 px-3 cursor-pointer transition-colors duration-300 shadow-transparent hover:bg-red-600 hover:text-white font-bold rounded-xl logout-btn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    خروج از حساب
                </button>
            </footer>
        </div>
        <!-- content -->
        <main class="max-lg:mr-0 max-md:pt-10 flex-1 mr-64">
            <!-- header -->
            <header class="max-lg:hidden [direction:ltr] sticky top-0 z-30 h-16 px-6 flex items-center justify-between dark:bg-dark-section-bg bg-light-section-bg border-b dark:border-dark-card-border border-light-card-border profile-header">
                
            </header>
            <!-- profile page content -->
            <div class="max-lg:pt-10 p-4 profile-content">
                
            </div>
        </main>
    </div>

    <!-- mobile menu overlay -->
    <div class="bg-black/30 inset-0 top-0 right-0 opacity-0 -z-1 transition-normal duration-300 profile-mobile-menu-overlay"></div>

    <script type="module" src="./src/utils/profile/profile.js"></script>
</body>

</html>
